# Local development infrastructure for VYBORA.
#   pnpm infra:up   /   pnpm infra:down
# Credentials here are for LOCAL DEVELOPMENT ONLY and match apps/api/.env.example.
name: vybora

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vybora
      POSTGRES_PASSWORD: vybora
      POSTGRES_DB: vybora
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vybora']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # S3-compatible object storage (stands in for AWS S3 locally)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vybora
      MINIO_ROOT_PASSWORD: vybora-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  # Creates buckets on first boot. Media bucket is public-read locally only;
  # in production it is private behind CloudFront signed URLs / OAC.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vybora vybora-dev-secret &&
      mc mb -p local/vybora-uploads &&
      mc mb -p local/vybora-media &&
      mc anonymous set download local/vybora-media &&
      echo buckets ready"

  # Catches all outgoing email (verification, OTP, password reset) → http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  redisdata:
  miniodata:
