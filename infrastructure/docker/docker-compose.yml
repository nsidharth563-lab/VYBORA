# Local development infrastructure for VYBORA.
#   pnpm infra:up   /   pnpm infra:down
# Credentials here are for LOCAL DEVELOPMENT ONLY and match apps/api/.env.example.
name: vybora

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vybora
      POSTGRES_PASSWORD: vybora
      POSTGRES_DB: vybora
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vybora']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # S3-compatible object storage (stands in for AWS S3 locally).
  # moto keeps objects in memory: uploads are lost when this container restarts.
  # (The minio/minio image was removed from Docker Hub.) The API creates the
  # buckets on boot when S3_CREATE_BUCKETS=true, as in apps/api/.env.example.
  s3:
    image: motoserver/moto:5.2.5
    ports: ["9000:5000"]

  # Catches all outgoing email (verification, OTP, password reset) → http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  redisdata:
